name: Déployer Catalpronos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l’application
        shell: bash
        run: |
          set -e
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html
          cp admin.html _site/admin.html
          cp "catalpronos app.html" "_site/catalpronos app.html"
          cp v3-patch.js _site/v3-patch.js
          cp v3-ux.js _site/v3-ux.js
          cp calendar-votes-fix.js _site/calendar-votes-fix.js
          cp final-bracket-admin-fix.js _site/final-bracket-admin-fix.js
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          cp icon.svg _site/icon.svg
          cp results.json _site/results.json

          python3 - <<'PY'
          from pathlib import Path

          app = Path('_site/catalpronos app.html')
          s = app.read_text(encoding='utf-8')
          s = s.replace('r8: ["France","Maroc",null,null,null,null,null,null],   // 8es par index bracket', 'r8: ["1-0","0-3","0-1","1-4","1-2","2-3",null,null],   // scores par index bracket')
          s = s.replace('r8:  ["France","Maroc",null,null,null,null,null,null],', 'r8:  ["France","Maroc","Espagne","Belgique","Norvège","Angleterre",null,null],')
          s = s.replace('"m": 94, "date": "07.07", "time": "05h", "bracket8": 3, "score": null', '"m": 94, "date": "07.07", "time": "05h", "bracket8": 3, "score": "1-4"')
          app.write_text(s, encoding='utf-8')

          index = Path('_site/index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('<script src="./v3-ux.js?v=333"><\/script></body>', '<script src="./v3-ux.js?v=352"><\/script><script src="./calendar-votes-fix.js?v=352"><\/script><script src="./final-bracket-admin-fix.js?v=352"><\/script></body>')
          h = h.replace('<script src="./v3-ux.js?v=341"><\/script><script src="./calendar-votes-fix.js?v=341"><\/script></body>', '<script src="./v3-ux.js?v=352"><\/script><script src="./calendar-votes-fix.js?v=352"><\/script><script src="./final-bracket-admin-fix.js?v=352"><\/script></body>')
          h = h.replace("catalpronos%20app.html?v=333", "catalpronos%20app.html?v=352")
          h = h.replace("catalpronos%20app.html?v=341", "catalpronos%20app.html?v=352")
          index.write_text(h, encoding='utf-8')
          PY

          touch _site/.nojekyll

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
