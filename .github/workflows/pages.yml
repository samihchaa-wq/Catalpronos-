name: Déployer Catalpronos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l’application
        shell: bash
        run: |
          set -e
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html
          cp "catalpronos app.html" "_site/catalpronos app.html"
          cp v3-patch.js _site/v3-patch.js
          cp v3-ux.js _site/v3-ux.js
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          cp icon.svg _site/icon.svg
          touch _site/.nojekyll

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
