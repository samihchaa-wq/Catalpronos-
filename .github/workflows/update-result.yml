name: Mettre à jour un résultat

on:
  workflow_dispatch:
    inputs:
      round:
        description: Tour (r8, qf, sf ou final)
        required: true
        type: choice
        options:
          - r8
          - qf
          - sf
          - final
      index:
        description: Index du match
        required: true
        default: "0"
      teamA:
        description: Équipe A
        required: true
      teamB:
        description: Équipe B
        required: true
      score:
        description: Score affiché
        required: true
      winner:
        description: Vainqueur
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Modifier le fichier de résultats
        env:
          ROUND: ${{ inputs.round }}
          INDEX: ${{ inputs.index }}
          TEAM_A: ${{ inputs.teamA }}
          TEAM_B: ${{ inputs.teamB }}
          SCORE: ${{ inputs.score }}
          WINNER: ${{ inputs.winner }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('results.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          round_key = os.environ['ROUND']
          index = os.environ['INDEX']
          record = {
              'teamA': os.environ['TEAM_A'],
              'teamB': os.environ['TEAM_B'],
              'score': os.environ['SCORE'],
              'winner': os.environ['WINNER'],
          }
          if record['winner'] not in (record['teamA'], record['teamB']):
              raise SystemExit('Vainqueur invalide')
          data['updatedAt'] = datetime.now(timezone.utc).isoformat()
          if round_key == 'final':
              data['final'] = record
          else:
              data.setdefault(round_key, {})[index] = record
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          git commit -m "Met à jour un résultat"
          git push
