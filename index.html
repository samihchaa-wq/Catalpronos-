<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catalpronos">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Les Catalpronos — CDM 2026</title>
<style>
html,body{margin:0;min-height:100%;background:#0A0F0D;color:#E8EDE6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading strong{display:block;color:#C9A84C;font-size:28px}.loading span{color:#6B8070;font-size:13px}.error{color:#ef7777}
</style>
</head>
<body>
<div class="loading"><div><strong>🏆 Les Catalpronos</strong><span>Chargement de l’application…</span></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('./catalpronos%20app.html?v=400',{cache:'no-store'});
    if(!response.ok) throw new Error('Fichier catalpronos app.html introuvable');
    let html=await response.text();

    const replace=(from,to,label)=>{
      if(!html.includes(from)) console.warn('[Catalpronos] Bloc non trouvé : '+label);
      html=html.replace(from,to);
    };

    replace(
      'const CAL_R8 = [{"m": 90, "date": "04.07", "time": "20h", "bracket8": 1, "score": "3-0"}, {"m": 89, "date": "04.07", "time": "23h", "bracket8": 0, "score": "1-0"}, {"m": 91, "date": "05.07", "time": "22h", "bracket8": 4, "score": null}, {"m": 92, "date": "06.07", "time": "04h", "bracket8": 5, "score": null}, {"m": 93, "date": "06.07", "time": "22h", "bracket8": 2, "score": null}, {"m": 94, "date": "07.07", "time": "05h", "bracket8": 3, "score": null}, {"m": 95, "date": "07.07", "time": "18h", "bracket8": 6, "score": null}, {"m": 96, "date": "08.07", "time": "01h", "bracket8": 7, "score": null}];',
      'const CAL_R8 = [{"m":90,"date":"04.07","time":"20h","bracket8":1,"score":"3-0"},{"m":89,"date":"04.07","time":"23h","bracket8":0,"score":"1-0"},{"m":91,"date":"05.07","time":"22h","bracket8":4,"score":"1-2"},{"m":92,"date":"06.07","time":"04h","bracket8":5,"score":"2-3"},{"m":93,"date":"06.07","time":"22h","bracket8":2,"score":"0-1"},{"m":94,"date":"07.07","time":"05h","bracket8":3,"score":"1-4"},{"m":95,"date":"07.07","time":"18h","bracket8":6,"score":null},{"m":96,"date":"08.07","time":"01h","bracket8":7,"score":null}];',
      'calendrier des huitièmes'
    );

    replace(
      'r8: ["France","Maroc",null,null,null,null,null,null],   // 8es par index bracket',
      'r8: ["France","Maroc","Espagne","Belgique","Norvège","Angleterre",null,null],   // 8es par index bracket',
      'scores affichés'
    );

    replace(
      'r8:  ["France","Maroc",null,null,null,null,null,null],',
      'r8:  ["France","Maroc","Espagne","Belgique","Norvège","Angleterre",null,null],',
      'résultats réels'
    );

    const jenny=/^(\s*"Jenny":\{r16:.*?champion:"France"\},\n)(\s*"Jenny":\{r16:.*?champion:"France"\},\n)/m;
    html=html.replace(jenny,'$1');

    html=html.replace(
      '</body>',
      '<script src="./v3-patch.js?v=370"><\/script>'+ 
      '<script src="./v3-ux.js?v=370"><\/script>'+ 
      '<script src="./calendar-votes-fix.js?v=370"><\/script>'+ 
      '<script src="./final-bracket-admin-fix.js?v=370"><\/script>'+ 
      '<script src="./admin-worker-publish.js?v=370"><\/script>'+ 
      '<script src="./results-sync.js?v=370"><\/script>'+ 
      '<script src="./participant-stats.js?v=370"><\/script>'+ 
      '<script src="./calendar-times-fix.js?v=370"><\/script>'+ 
      '<script src="./scoring-brackets-v4.js?v=400"><\/script>'+ 
      '<script src="./remaining-teams-v4.js?v=400"><\/script>'+ 
      '</body>'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div class="loading"><div><strong class="error">Erreur de chargement</strong><span id="load-error"></span></div></div>';
    const message=document.getElementById('load-error');
    if(message) message.textContent=String(error && error.message ? error.message : error);
  }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
}
</script>
</body>
</html>
