<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les Catalpronos — CDM 2026</title>
<style>
html,body{margin:0;min-height:100%;background:#0A0F0D;color:#E8EDE6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading strong{display:block;color:#C9A84C;font-size:28px}.loading span{color:#6B8070;font-size:13px}.error{color:#ef7777}
</style>
</head>
<body>
<div class="loading"><div><strong>🏆 Les Catalpronos</strong><span>Mise à jour des résultats…</span></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('./catalpronos%20app.html?v=220707',{cache:'no-store'});
    if(!response.ok)throw new Error('Fichier catalpronos app.html introuvable');
    let html=await response.text();

    const replace=(from,to,label)=>{
      if(!html.includes(from))console.warn('Bloc non trouvé : '+label);
      html=html.replace(from,to);
    };

    replace(
      'const CAL_R8 = [{"m": 90, "date": "04.07", "time": "20h", "bracket8": 1, "score": "3-0"}, {"m": 89, "date": "04.07", "time": "23h", "bracket8": 0, "score": "1-0"}, {"m": 91, "date": "05.07", "time": "22h", "bracket8": 4, "score": null}, {"m": 92, "date": "06.07", "time": "04h", "bracket8": 5, "score": null}, {"m": 93, "date": "06.07", "time": "22h", "bracket8": 2, "score": null}, {"m": 94, "date": "07.07", "time": "05h", "bracket8": 3, "score": null}, {"m": 95, "date": "07.07", "time": "18h", "bracket8": 6, "score": null}, {"m": 96, "date": "08.07", "time": "01h", "bracket8": 7, "score": null}];',
      'const CAL_R8 = [{"m":90,"date":"04.07","time":"20h","bracket8":1,"score":"3-0"},{"m":89,"date":"04.07","time":"23h","bracket8":0,"score":"1-0"},{"m":91,"date":"05.07","time":"22h","bracket8":4,"score":"1-2"},{"m":92,"date":"06.07","time":"04h","bracket8":5,"score":"2-3"},{"m":93,"date":"06.07","time":"22h","bracket8":2,"score":"0-1"},{"m":94,"date":"07.07","time":"05h","bracket8":3,"score":"1-3 (63e)"},{"m":95,"date":"07.07","time":"18h","bracket8":6,"score":null},{"m":96,"date":"08.07","time":"01h","bracket8":7,"score":null}];',
      'calendrier des huitièmes'
    );

    replace(
      'r8: ["France","Maroc",null,null,null,null,null,null],   // 8es par index bracket',
      'r8: ["France","Maroc","Espagne",null,"Norvège","Angleterre",null,null],   // 8es par index bracket',
      'scores affichés'
    );

    replace(
      'r8:  ["France","Maroc",null,null,null,null,null,null],',
      'r8:  ["France","Maroc","Espagne",null,"Norvège","Angleterre",null,null],',
      'résultats réels'
    );

    replace(
      'Dernière mise à jour : <span id="last-update">En attente des résultats</span>',
      'Dernière mise à jour : <span id="last-update">7 juillet 2026 — États-Unis 1–3 Belgique (63e)</span>',
      'date de mise à jour'
    );

    const jenny=/^(\s*"Jenny":\{r16:.*?champion:"France"\},\n)(\s*"Jenny":\{r16:.*?champion:"France"\},\n)/m;
    html=html.replace(jenny,'$1');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div class="loading"><div><strong class="error">Erreur de chargement</strong><span>'+String(error.message)+'</span></div></div>';
  }
})();
</script>
</body>
</html>
